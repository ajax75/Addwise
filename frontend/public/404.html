<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crystal Blue Water Solutions</title>
    <!--
      SPA fallback for GitHub Pages. GitHub serves this file for any unknown
      path; it rewrites the URL into a query the app can restore, then redirects
      to index.html. See https://github.com/rafgraph/spa-github-pages
      pathSegmentsToKeep = 1 because the site lives under /Addwise/.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
